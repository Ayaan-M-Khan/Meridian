<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Meridian: a globe outline with a single meridian, and a marker at its north point. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232327"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="107.25" fill="url(#sheen)" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
  <g fill="none" stroke="#f2f2f4" stroke-width="22" stroke-linecap="round">
    <circle cx="256" cy="268" r="148"/>
    <ellipse cx="256" cy="268" rx="58" ry="148"/>
  </g>
  <circle cx="256" cy="120" r="30" fill="#3d8bfd" stroke="#0e0e10" stroke-width="10"/>
</svg>
